name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for correctness, security, and compliance
            with the repository's CLAUDE.md guidelines. For each issue found:
            - Post an inline comment on the exact line where the issue occurs
            - State the issue clearly and concisely
            - Reference the specific CLAUDE.md rule violated if applicable
            Focus on bugs that would break production. Do not comment on style
            or formatting issues not covered in CLAUDE.md.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,
            Bash(gh pr comment:*),
            Bash(gh pr diff:*),
            Bash(gh pr view:*)"